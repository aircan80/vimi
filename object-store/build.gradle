buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.vibeminer'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

sourceSets {
    benchmark {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    crashTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    crashTestImplementation.extendsFrom testImplementation
    crashTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    integrationTestImplementation sourceSets.benchmark.output
    integrationTestImplementation testFixtures(project(':object-store'))
    crashTestImplementation testFixtures(project(':object-store'))
}

// Fast unit and in-memory contract tests are the normal development command.
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    maxParallelForks = 1
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
        inputs.file(sqliteLibrary).withPropertyName('sqliteLibrary')
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs disk-store contracts, recovery, corruption and staging tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
}

tasks.register('crashTest', Test) {
    description = 'Kills child writers at deterministic durability boundaries (opt in).'
    group = 'verification'
    testClassesDirs = sourceSets.crashTest.output.classesDirs
    classpath = sourceSets.crashTest.runtimeClasspath
    shouldRunAfter tasks.named('integrationTest')
}

// CI's check includes Java integration tests.
tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

spotless {
    java {
        target 'src/**/*.java'
        forbidWildcardImports()
        googleJavaFormat('1.30.0').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

// Explicitly opt in; benchmark workloads are never part of test/check.
tasks.register('benchmark', JavaExec) {
    description = 'Measures deterministic temporary-store reads, writes, rebuild and compaction.'
    group = 'verification'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'com.vibeminer.store.StoreBenchmarks'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args providers.gradleProperty('benchmarkObjects').orElse('64').get(),
         providers.gradleProperty('benchmarkBytes').orElse('65536').get(),
         providers.gradleProperty('benchmarkMode').orElse('all').get()
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
    }
}

// Experimental backend stays out of production artifacts; requires an explicit disk directory.
tasks.register('sqliteBlobBenchmark', JavaExec) {
    description = 'Checks bounded-memory SQLite BLOB streaming up to 512 MiB (opt in).'
    group = 'verification'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'com.vibeminer.store.SqliteBlobBenchmarks'
    maxHeapSize = '128m'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args providers.gradleProperty('blobBenchmarkDirectory').orElse(
        rootProject.layout.projectDirectory.dir('.local/storage-evaluation').asFile.absolutePath).get()
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
    }
}

tasks.register('storageComparison', JavaExec) {
    description = 'Compares sequential verified small-object writes and warm reads (opt in).'
    group = 'verification'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'com.vibeminer.store.StorageComparison'
    maxHeapSize = '512m'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args providers.gradleProperty('blobBenchmarkDirectory').orElse(
        rootProject.layout.projectDirectory.dir('.local/storage-evaluation').asFile.absolutePath).get()
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
    }
}

tasks.register('blobConcurrency', JavaExec) {
    description = 'Measures foreground read/accounting latency during a 512 MiB BLOB write.'
    group = 'verification'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'com.vibeminer.store.BlobConcurrency'
    maxHeapSize = '128m'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args providers.gradleProperty('blobBenchmarkDirectory').orElse(
        rootProject.layout.projectDirectory.dir('.local/storage-evaluation').asFile.absolutePath).get()
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
    }
}

tasks.register('boundedStagingBenchmark', JavaExec) {
    description = 'Checks verified 145/512 MiB staged objects and interleaved foreground writes.'
    group = 'verification'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'com.vibeminer.store.BoundedStagingBenchmarks'
    maxHeapSize = '128m'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args providers.gradleProperty('blobBenchmarkDirectory').orElse(
        rootProject.layout.projectDirectory.dir('.local/storage-evaluation').asFile.absolutePath).get()
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
    }
}

tasks.register('libraryAccountingBenchmark', JavaExec) {
    description = 'Measures isolated build-scale ownership queries and foreground metadata latency.'
    group = 'verification'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'com.vibeminer.store.LibraryAccountingBenchmarks'
    maxHeapSize = '512m'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args providers.gradleProperty('blobBenchmarkDirectory').orElse(
        rootProject.layout.projectDirectory.dir('.local/storage-evaluation').asFile.absolutePath).get(),
         providers.gradleProperty('accountingBenchmarkObjects').orElse('2209282').get()
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
    }
}

tasks.register('productionStorageComparison', JavaExec) {
    description = 'Compares the production SQLite and pack APIs with verified sequential objects.'
    group = 'verification'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'com.vibeminer.store.StorageComparison'
    maxHeapSize = '512m'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args providers.gradleProperty('blobBenchmarkDirectory').orElse(
        rootProject.layout.projectDirectory.dir('.local/storage-evaluation').asFile.absolutePath).get(),
         'production'
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
    }
}
