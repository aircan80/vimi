name: Desktop prereleases

on:
  push:
    tags: ['v*-alpha.*', 'v*-beta.*', 'v*-rc.*']
    branches: [feature/desktop-prereleases]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prerelease version to validate (dry run only)'
        required: true
        default: v0.1.0-alpha.1

permissions:
  contents: read

concurrency:
  group: desktop-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x64, runner: ubuntu-24.04}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm}
          - {platform: windows-x64, runner: windows-2025}
          - {platform: macos-arm64, runner: macos-15}
          - {platform: macos-x64, runner: macos-15-intel}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.0-alpha.1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate prerelease and source
        run: |
          python -c 'import sys; sys.path.insert(0,"scripts/release"); from package_app import version; import os; print(version(os.environ["RELEASE_TAG"]))'
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then git merge-base --is-ancestor "$GITHUB_SHA" origin/main; fi
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          java-package: jdk
          cache: gradle
          overwrite-settings: false
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsqlite3-0 libgtk-3-0t64 libxtst6 libxi6 libxrender1 xvfb xauth fakeroot rpm
      - name: Install macOS SQLite
        if: runner.os == 'macOS'
        run: brew list sqlite >/dev/null 2>&1 || brew install sqlite
      - name: Locate verified native SQLite
        id: sqlite
        run: python scripts/ci/native_sqlite.py --directory "$RUNNER_TEMP/vimi-sqlite"
      - name: Prepare verified platform JavaFX notices
        id: javafx
        run: python scripts/ci/javafx_sdk.py --platform "${{ matrix.platform }}" --directory "$RUNNER_TEMP/vimi-javafx"
      - name: Check packaging helpers
        run: |
          python -m unittest discover -s scripts/ci -p 'javafx_sdk_test.py'
          python -m unittest discover -s scripts/ci -p 'native_sqlite_test.py'
          python -m unittest discover -s scripts/release -p '*_test.py'
      - name: Build and check distribution
        env:
          SQLITE_LIBRARY: ${{ steps.sqlite.outputs.library }}
          JAVAFX_REPOSITORY: ${{ steps.javafx.outputs.repository }}
          JAVAFX_NATIVE: ${{ steps.javafx.outputs.native }}
        run: |
          args=()
          if [ -n "$JAVAFX_REPOSITORY" ]; then args+=("-PjavafxSdkRepository=$JAVAFX_REPOSITORY"); fi
          if [ -n "$JAVAFX_NATIVE" ]; then args+=("-PjavafxNativeLibrary=$JAVAFX_NATIVE"); fi
          ./gradlew check :gui:installDist "-PsqliteLibrary=$SQLITE_LIBRARY" "${args[@]}" --no-daemon --console=plain
      - name: Build installers and test packaged GUI
        env:
          SQLITE_LIBRARY: ${{ steps.sqlite.outputs.library }}
          JAVAFX_NATIVE: ${{ steps.javafx.outputs.native }}
          JAVAFX_LEGAL: ${{ steps.javafx.outputs.legal }}
        run: |
          args=()
          if [ -n "$JAVAFX_NATIVE" ]; then args+=(--javafx-native "$JAVAFX_NATIVE"); fi
          prefix=()
          if [ "$RUNNER_OS" = Linux ]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" python scripts/release/package_app.py --tag "$RELEASE_TAG" --sqlite "$SQLITE_LIBRARY" --output dist --javafx-legal "$JAVAFX_LEGAL" "${args[@]}" --ui-smoke
      - name: Retain packages and manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prerelease-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Validate and publish complete prerelease
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.0-alpha.1' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prerelease-*
          path: artifacts
      - name: Validate every platform before publication
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then args+=(--publish); fi
          python scripts/release/publish_prerelease.py --directory artifacts --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --notes "docs/releases/$RELEASE_TAG.md" "${args[@]}"
