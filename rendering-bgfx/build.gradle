tasks.register('nativeGpuWorldStreamSessionProof', JavaExec) {
    group = 'verification'
    description = 'Exercises the isolated authored World v2 actor and typed child protocol.'
    dependsOn testClasses, tasks.named('verifyWorldStreamShaders'), tasks.named('verifyShaders')
