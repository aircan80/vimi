    mainClass = 'com.vibeminer.rendering.bgfx.WorldStreamSessionProof'
    timeout = java.time.Duration.ofMinutes(3)
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args layout.buildDirectory.dir('native-world-stream-owner').get().asFile.absolutePath
