    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vibeminer.rendering.bgfx.WorldStreamSpike'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args layout.buildDirectory.dir('native-world-stream-spike').get().asFile.absolutePath
