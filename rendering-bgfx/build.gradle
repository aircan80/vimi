tasks.register('verifyWorldStreamShaders', Exec) {
    group = 'verification'
    description = 'Verifies separate production persistent-World shader profiles.'
    inputs.files(shaderHelper, rootProject.file('scripts/rendering/compile_bgfx_world_stream_shaders.py'))
    inputs.dir(layout.projectDirectory.dir('src/main/shaders/world-stream'))
