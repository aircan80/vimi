tasks.named('processResources') { dependsOn tasks.named('verifyWorldStreamShaders') }
tasks.named('check') { dependsOn tasks.named('verifyWorldStreamShaders') }

tasks.register('nativeGpuWorldStreamOwnerProof', JavaExec) {
    group = 'verification'
    description = 'Exercises persistent production World uploads, callback drain and v2 readback tickets.'
    dependsOn testClasses, tasks.named('verifyWorldStreamShaders'), tasks.named('verifyShaders')
