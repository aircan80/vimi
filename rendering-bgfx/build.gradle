// The cold WMO pass has a separate recipe/manifest; existing shader bytes stay unchanged.
tasks.register('verifyWorldWmoShaders', Exec) {
    group = 'verification'
    description = 'Verifies dedicated cold BASIC WMO shader profiles offline.'
    inputs.files(shaderHelper, rootProject.file('scripts/rendering/compile_bgfx_world_wmo.py'))
    inputs.dir(layout.projectDirectory.dir('src/main/shaders/world-wmo'))
    inputs.dir(layout.projectDirectory.dir('src/main/resources/com/vibeminer/rendering/bgfx/shaders/world-wmo'))
    workingDir rootProject.layout.projectDirectory
    commandLine pythonExecutable.get(), rootProject.file('scripts/rendering/compile_bgfx_world_wmo.py').absolutePath, '--verify'
}
tasks.named('processResources') { dependsOn tasks.named('verifyWorldWmoShaders') }
tasks.named('check') { dependsOn tasks.named('verifyWorldWmoShaders') }

tasks.register('nativeGpuWorldWmoProof', JavaExec) {
    group = 'verification'
    description = 'Checks cold WMO authored same-depth pixels, sampling, fog and upload retirement.'
    dependsOn testClasses, tasks.named('verifyWorldWmoShaders'), tasks.named('verifyTerrainShaders')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vibeminer.rendering.bgfx.WorldWmoNativeProof'
    timeout = java.time.Duration.ofMinutes(2)
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args layout.buildDirectory.dir('native-world-wmo').get().asFile.absolutePath
}


tasks.register('nativeGpuWorldWmoColdChildProof', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vibeminer.rendering.bgfx.WorldWmoColdChildProof'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args layout.buildDirectory.dir('world-wmo-cold-child-proof').get().asFile.absolutePath
}

tasks.register('nativeGpuWorldStreamTransportProof', JavaExec) {
    group = 'verification'
    description = 'Exercises actual native startup, camera publication and drain through the public World transport.'
    dependsOn testClasses, tasks.named('verifyWorldStreamShaders'), tasks.named('verifyShaders')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vibeminer.rendering.bgfx.WorldStreamTransportProof'
    timeout = java.time.Duration.ofMinutes(1)
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args layout.buildDirectory.dir('native-world-stream-public-lifecycle').get().asFile.absolutePath
}

tasks.register('nativeGpuWorldStreamObjectsProof', JavaExec) {
    group = 'verification'
    description = 'Checks actual hot-child opaque, cutout and blended exterior object pixels over authored terrain.'
    dependsOn testClasses, tasks.named('verifyWorldStreamShaders'), tasks.named('verifyWorldWmoShaders'), tasks.named('verifyShaders')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vibeminer.rendering.bgfx.WorldStreamObjectsMaterialProof'
    timeout = java.time.Duration.ofMinutes(1)
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args layout.buildDirectory.dir('native-world-stream-objects').get().asFile.absolutePath
