buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

plugins {
    id 'java-library'
    id 'application'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.vibeminer'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

def lwjglVersion = '3.4.3'
def supportedPlatforms = [
    'linux-x64': 'natives-linux',
    'linux-arm64': 'natives-linux-arm64',
    'macos-x64': 'natives-macos',
    'macos-arm64': 'natives-macos-arm64',
    'windows-x64': 'natives-windows'
]
def hostSystem = System.getProperty('os.name').toLowerCase().contains('mac') ? 'macos' :
        (System.getProperty('os.name').toLowerCase().contains('win') ? 'windows' : 'linux')
def hostArch = System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'arm64' : 'x64'
def targetPlatform = providers.gradleProperty('bgfxPlatform').orElse(hostSystem + '-' + hostArch).get()
if (!supportedPlatforms.containsKey(targetPlatform)) {
    throw new GradleException("Unsupported bgfx platform: ${targetPlatform}")
}

application {
    mainClass = 'com.vibeminer.rendering.bgfx.GpuViewerMain'
    applicationName = 'vimi-gpu-viewer'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED'] +
        (hostSystem == 'macos' ? ['-XstartOnFirstThread'] : [])
}


dependencies {
    api project(':rendering-models')
    api project(':rendering-world')
    testImplementation project(':formats-assets')
    ['lwjgl', 'lwjgl-bgfx'].each {
        implementation "org.lwjgl:${it}:${lwjglVersion}"
        runtimeOnly "org.lwjgl:${it}:${lwjglVersion}:${supportedPlatforms[targetPlatform]}"
    }
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// Fast unit and in-memory contract tests are the normal development command.
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // SymbolicLinks fails instead of skipping under CI, so a cached local result must not be reused.
    inputs.property('ci', providers.environmentVariable('CI').orElse(''))
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    maxParallelForks = 1
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
        inputs.file(sqliteLibrary).withPropertyName('sqliteLibrary')
    }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }

}

spotless {
    java {
        target 'src/**/*.java'
        forbidWildcardImports()
        googleJavaFormat('1.30.0').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}





// Shader binaries are checked-in resources. Normal builds verify them without downloading tools.
def shaderHelper = rootProject.layout.projectDirectory.file('scripts/rendering/compile_bgfx_shaders.py')
// Override with -Ppython=<interpreter>. Windows installers provide `python`; macOS and many
// Linux distributions provide only `python3` on PATH.
def defaultPython = providers.systemProperty('os.name')
        .map { it.toLowerCase(Locale.ROOT).startsWith('windows') ? 'python' : 'python3' }
def pythonExecutable = providers.gradleProperty('python').orElse(defaultPython)
tasks.register('verifyShaders', Exec) {
    group = 'verification'
    description = 'Verifies committed shader sources, manifest and offline bgfx binaries.'
    workingDir rootProject.layout.projectDirectory
    commandLine pythonExecutable.get(), shaderHelper.asFile.absolutePath, '--verify'
    inputs.file(shaderHelper)
    inputs.dir(layout.projectDirectory.dir('src/main/shaders'))
    inputs.dir(layout.projectDirectory.dir('src/main/resources/com/vibeminer/rendering/bgfx/shaders'))
}
tasks.named('processResources') { dependsOn tasks.named('verifyShaders') }
tasks.register('shaderBuildHelperTest', Exec) {
    group = 'verification'
    description = 'Runs offline shader-manifest and compiler-policy regression tests.'
    workingDir rootProject.layout.projectDirectory
    commandLine pythonExecutable.get(), '-m', 'unittest', 'discover', '-s', 'scripts/rendering', '-p', '*_test.py'
    inputs.files(rootProject.fileTree('scripts/rendering') { include '*.py' })
}
tasks.named('check') {
    dependsOn tasks.named('verifyShaders'), tasks.named('shaderBuildHelperTest')
}

tasks.register('compileShaders', Exec) {
    group = 'build'
    description = 'Explicitly regenerates shader blobs with the pinned matching bgfx compiler.'
    workingDir rootProject.layout.projectDirectory
    commandLine pythonExecutable.get(), shaderHelper.asFile.absolutePath
}

// Explicit hardware/native diagnostic; never part of portable default checks.
tasks.register('nativeGpuSmoke', JavaExec) {
    group = 'verification'
    description = 'Renders an authored fixture using headless Vulkan and writes diagnostic evidence.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.vibeminer.rendering.bgfx.GpuViewerMain'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args '--headless-smoke', layout.buildDirectory.dir('native-gpu-proof').get().asFile.absolutePath
}

tasks.register('nativeGpuMaterialProof', JavaExec) {
    group = 'verification'
    description = 'Checks authored material, visibility and depth cases on headless Vulkan.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vibeminer.rendering.bgfx.GpuMaterialProof'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args layout.buildDirectory.dir('native-material-proof').get().asFile.absolutePath
}

// Loads packaged bindings and native entry points without a display, GPU, or bgfx initialization.
tasks.register('nativeRuntimeProbe', JavaExec) {
    group = 'verification'
    description = 'Loads LWJGL/bgfx natives and verifies backend and shader availability without a GPU.'
    dependsOn classes, tasks.named('verifyShaders')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.vibeminer.rendering.bgfx.GpuRuntimeProbe'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (hostSystem == 'macos') jvmArgs '-XstartOnFirstThread'
    onlyIf { targetPlatform == hostSystem + '-' + hostArch }
}
tasks.named('check') { dependsOn tasks.named('nativeRuntimeProbe') }

// Explicit real GPU sidecar proof; requires a supported hardware adapter.
tasks.register('nativeGpuInlineProof', JavaExec) {
    group = 'verification'
    description = 'Checks actual offscreen GPU frames, controls, resize and shutdown.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vibeminer.rendering.bgfx.GpuInlineProof'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args layout.buildDirectory.dir('native-inline-proof').get().asFile.absolutePath
}

// Authored-data feasibility only; separate from production terrain and default hardware checks.
tasks.register('verifyTerrainSpikeShaders', Exec) {
    group = 'verification'
    description = 'Verifies separate authored terrain-spike shader resources.'
    inputs.files(rootProject.file('scripts/rendering/compile_bgfx_terrain_spike.py'), shaderHelper)
    inputs.dir(layout.projectDirectory.dir('src/test/shaders/terrain-spike'))
    inputs.dir(layout.projectDirectory.dir('src/test/resources/com/vibeminer/rendering/bgfx/terrain-spike'))
    workingDir rootProject.layout.projectDirectory
    commandLine pythonExecutable.get(), rootProject.file('scripts/rendering/compile_bgfx_terrain_spike.py').absolutePath, '--verify'
}
tasks.register('nativeGpuTerrainSpike', JavaExec) {
    group = 'verification'
    description = 'Proves authored persistent triangle instancing and reversed infinite depth.'
    dependsOn testClasses, tasks.named('verifyTerrainSpikeShaders')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vibeminer.rendering.bgfx.GpuTerrainSpike'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args layout.buildDirectory.dir('native-terrain-spike').get().asFile.absolutePath
}

tasks.register('nativeGpuTerrainAcceptance', JavaExec) {
    group = 'verification'
    description = 'Runs independently authored terrain projection, color and depth oracles.'
    dependsOn testClasses, tasks.named('verifyTerrainSpikeShaders')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vibeminer.rendering.bgfx.TerrainSpikeAcceptance'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args layout.buildDirectory.dir('native-terrain-independent').get().asFile.absolutePath
}

// Production terrain and sky have independent pinned manifests; model shader bounds stay unchanged.
tasks.register('verifyTerrainShaders', Exec) {
    group = 'verification'
    workingDir rootProject.layout.projectDirectory
    commandLine pythonExecutable.get(), rootProject.file('scripts/rendering/compile_bgfx_terrain.py').absolutePath, '--verify'
    inputs.files(shaderHelper, rootProject.file('scripts/rendering/compile_bgfx_terrain.py'), rootProject.file('scripts/rendering/compile_bgfx_terrain_spike.py'))
    inputs.dir(layout.projectDirectory.dir('src/main/shaders/terrain'))
    inputs.dir(layout.projectDirectory.dir('src/main/resources/com/vibeminer/rendering/bgfx/shaders/terrain'))
}
tasks.named('processResources') { dependsOn tasks.named('verifyTerrainShaders') }
tasks.named('check') { dependsOn tasks.named('verifyTerrainShaders') }

tasks.register('nativeGpuTerrainProductionAcceptance', JavaExec) {
    group = 'verification'
    description = 'Runs independently authored oracles against the production terrain renderer.'
    dependsOn testClasses, tasks.named('verifyTerrainShaders')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vibeminer.rendering.bgfx.TerrainProductionAcceptance'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args layout.buildDirectory.dir('native-terrain-production').get().asFile.absolutePath
}

tasks.register('nativeGpuTerrainInlineProof', JavaExec) {
    group = 'verification'
    description = 'Checks actual terrain child controls, mapped frames, resize and terminal shutdown.'
    dependsOn testClasses, tasks.named('verifyTerrainShaders')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vibeminer.rendering.bgfx.TerrainProductionInlineProof'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args layout.buildDirectory.dir('native-terrain-inline').get().asFile.absolutePath
}

tasks.register('nativeGpuTerrainTextureProof', JavaExec) {
    group = 'verification'
    description = 'Checks authored terrain atlas sampling, fog, fallback and source-order Vulkan frames.'
    dependsOn testClasses, tasks.named('verifyTerrainShaders')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vibeminer.rendering.bgfx.TerrainTextureNativeProof'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args layout.buildDirectory.dir('native-terrain-textures').get().asFile.absolutePath
}

// Authored persistent-World feasibility; no production shader or renderer replacement.
tasks.register('verifyWorldStreamSpikeShaders', Exec) {
    group = 'verification'
    description = 'Verifies separate authored persistent-World shader profiles.'
    inputs.files(shaderHelper, rootProject.file('scripts/rendering/compile_bgfx_world_stream_spike.py'))
