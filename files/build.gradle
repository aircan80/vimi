buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.vibeminer'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

sourceSets {
    interopTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    interopTestImplementation.extendsFrom testImplementation
    interopTestRuntimeOnly.extendsFrom testRuntimeOnly
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-core:2.20.1'
    api project(':builds')
    api project(':generated-store')
    testFixturesApi platform('org.junit:junit-bom:5.13.4')
    testFixturesApi 'org.junit.jupiter:junit-jupiter-api'
    testFixturesApi testFixtures(project(':object-access'))
    testFixturesImplementation testFixtures(project(':builds'))
    testImplementation testFixtures(project(':object-access'))
    testImplementation testFixtures(project(':builds'))
    testImplementation testFixtures(project(':generated-store'))
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Fast unit and in-memory contract tests are the normal development command.
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    maxParallelForks = 1
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
        inputs.file(sqliteLibrary).withPropertyName('sqliteLibrary')
    }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }

}

tasks.register('integrationTest', Test) {
    description = 'Runs Files disk and layer-pipeline integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
}

// CI's check includes Java integration tests. Interop is explicitly requested separately.
tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

spotless {
    java {
        target 'src/**/*.java'
        forbidWildcardImports()
        googleJavaFormat('1.30.0').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}


// Optional compatibility suite, requiring the pinned C# Files reference built in Release.
def filesReferenceRoot = providers.gradleProperty('referenceRoot').orElse(rootProject.layout.projectDirectory.dir('../vibeminer').asFile.absolutePath)
def filesDotnet = providers.gradleProperty('dotnet').orElse(rootProject.layout.projectDirectory.file('../vibeminer/.local/toolchains/dotnet/dotnet').asFile.absolutePath)
def filesCsharp = layout.projectDirectory.dir('src/interopTest/csharp')
tasks.register('buildCsharpInterop', Exec) {
    workingDir rootProject.layout.projectDirectory
    environment 'DOTNET_CLI_TELEMETRY_OPTOUT', '1'
    commandLine filesDotnet.get(), 'build', filesCsharp.file('Interop.csproj').asFile.absolutePath,
        '-p:RestoreLockedMode=true', '-p:NuGetAudit=false', '-p:ReferenceRoot=' + filesReferenceRoot.get(), '--nologo'
}
tasks.register('interopTest', Test) {
    group = 'verification'
    dependsOn tasks.named('buildCsharpInterop')
    testClassesDirs = sourceSets.interopTest.output.classesDirs
    classpath = sourceSets.interopTest.runtimeClasspath
    systemProperty 'vimi.dotnet', filesDotnet.get()
    systemProperty 'vimi.files.interop.harness', filesCsharp.file('bin/Debug/net10.0/VibeMiner.Files.Tests.dll').asFile.absolutePath
    inputs.files(fileTree(filesCsharp) { include '*.cs', '*.csproj', 'packages.lock.json' })
    inputs.file(file(filesReferenceRoot.get() + '/src/backend/VibeMiner.Files/bin/Release/net10.0/VibeMiner.Files.dll'))
    inputs.files(fileTree(filesCsharp.dir('bin/Debug/net10.0')))
    shouldRunAfter tasks.named('integrationTest')
}
