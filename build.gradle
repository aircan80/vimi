buildscript {
    configurations.classpath { resolutionStrategy.activateDependencyLocking() }
}

plugins {
    id 'base'
    id 'com.diffplug.spotless' version '8.10.4' apply false
}

// Checkstyle runs in a Gradle worker daemon whose heap defaults to 512m regardless of
// org.gradle.jvmargs. ANTLR prediction caches outgrew that on Windows CI (OutOfMemoryError
// in PredictionContext.mergeArrays while parsing rendering-bgfx test sources).
subprojects {
    plugins.withId('checkstyle') {
        tasks.withType(Checkstyle).configureEach {
            maxHeapSize = '1g'
        }
    }
}

// Root lifecycle tasks intentionally aggregate only the components that exist.
tasks.named('check') {
    dependsOn ':object-store:check', ':generated-store:check', ':network-clients:check', ':object-access:check', ':builds:check', ':files:check', ':formats-assets:check', ':formats-tables:check', ':concepts-core:check', ':concepts-items:check', ':concepts-creatures:check', ':concepts-npcs:check', ':concepts-quests:check', ':formats-world:check', ':concepts-world:check', ':rendering-world:check', ':concepts-talents:check', ':concepts-races:check', ':concepts-models:check', ':concepts-mounts:check', ':concepts-professions:check', ':concepts-dungeons:check', ':concepts-locations:check', ':concepts-comparison:check', ':rendering-bgfx:check', ':concepts-effects:check', ':gui:check', ':questie:check', ':polestar:check', ':eg-link:check', ':accounting:check'
}
tasks.named('assemble') {
    dependsOn ':object-store:assemble', ':generated-store:assemble', ':network-clients:assemble', ':object-access:assemble', ':builds:assemble', ':files:assemble', ':formats-assets:assemble', ':formats-tables:assemble', ':concepts-core:assemble', ':concepts-items:assemble', ':concepts-creatures:assemble', ':concepts-npcs:assemble', ':concepts-quests:assemble', ':formats-world:assemble', ':concepts-world:assemble', ':rendering-world:assemble', ':concepts-talents:assemble', ':concepts-races:assemble', ':concepts-models:assemble', ':concepts-mounts:assemble', ':concepts-professions:assemble', ':concepts-dungeons:assemble', ':concepts-locations:assemble', ':concepts-comparison:assemble', ':rendering-bgfx:assemble', ':concepts-effects:assemble', ':gui:assemble', ':questie:assemble', ':polestar:assemble', ':eg-link:assemble', ':accounting:assemble'
}
