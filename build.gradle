buildscript {
    configurations.classpath { resolutionStrategy.activateDependencyLocking() }
}

plugins {
    id 'base'
    id 'com.diffplug.spotless' version '8.10.4' apply false
}

// Root lifecycle tasks intentionally aggregate only the components that exist.
tasks.named('check') {
    dependsOn ':object-store:check', ':generated-store:check', ':network-clients:check', ':object-access:check', ':builds:check', ':files:check', ':formats-assets:check', ':formats-tables:check', ':concepts-core:check', ':concepts-items:check', ':concepts-creatures:check', ':concepts-npcs:check', ':concepts-quests:check', ':concepts-talents:check', ':concepts-races:check', ':concepts-effects:check', ':gui:check', ':questie:check', ':polestar:check', ':eg-link:check', ':accounting:check'
}
tasks.named('assemble') {
    dependsOn ':object-store:assemble', ':generated-store:assemble', ':network-clients:assemble', ':object-access:assemble', ':builds:assemble', ':files:assemble', ':formats-assets:assemble', ':formats-tables:assemble', ':concepts-core:assemble', ':concepts-items:assemble', ':concepts-creatures:assemble', ':concepts-npcs:assemble', ':concepts-quests:assemble', ':concepts-talents:assemble', ':concepts-races:assemble', ':concepts-effects:assemble', ':gui:assemble', ':questie:assemble', ':polestar:assemble', ':eg-link:assemble', ':accounting:assemble'
}
