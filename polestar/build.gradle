buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.vibeminer'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

sourceSets {
    integrationTest { compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output }
}
configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies {
    implementation project(':object-store')
    api project(':network-clients')
    implementation 'com.fasterxml.jackson.core:jackson-core:2.20.1'
    testImplementation testFixtures(project(':polestar'))
    integrationTestImplementation testFixtures(project(':polestar'))
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.register('integrationTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
}
// Native SQLite belongs to explicit integration checks, not hosted unit tests.
// Fast unit and in-memory contract tests are the normal development command.
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    maxParallelForks = 1
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
        inputs.file(sqliteLibrary).withPropertyName('sqliteLibrary')
    }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }

}

spotless {
    java {
        target 'src/**/*.java'
        forbidWildcardImports()
        googleJavaFormat('1.30.0').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}





tasks.named('check') { dependsOn tasks.named('integrationTest') }
tasks.withType(JavaExec).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
}
