buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.vibeminer'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

sourceSets {
    interopTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        resources.srcDir 'src/test/resources'
    }
    integrationTest { compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output }
}
configurations {
    interopTestImplementation.extendsFrom testImplementation
    interopTestRuntimeOnly.extendsFrom testRuntimeOnly
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies {
    api project(':formats-tables')
    testImplementation testFixtures(project(':formats-tables'))
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// Fast unit and in-memory contract tests are the normal development command.
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    maxParallelForks = 1
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
        inputs.file(sqliteLibrary).withPropertyName('sqliteLibrary')
    }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }

}

spotless {
    java {
        target 'src/**/*.java'
        forbidWildcardImports()
        googleJavaFormat('1.30.0').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}




tasks.register('integrationTest', Test) { group='verification'; testClassesDirs=sourceSets.integrationTest.output.classesDirs; classpath=sourceSets.integrationTest.runtimeClasspath; shouldRunAfter tasks.named('test') }
tasks.named('check') {dependsOn tasks.named('integrationTest')}

def referenceRoot = providers.gradleProperty('referenceRoot').orElse(rootProject.layout.projectDirectory.dir('../vibeminer').asFile.absolutePath)
def dotnetExecutable = providers.gradleProperty('dotnet').orElse(rootProject.layout.projectDirectory.file('../vibeminer/.local/toolchains/dotnet/dotnet').asFile.absolutePath)
def csharpDirectory = layout.projectDirectory.dir('src/interopTest/csharp')
def goldenOutput = layout.buildDirectory.file('interop/queries.json')
tasks.register('buildCsharpInterop', Exec) {
    workingDir rootProject.layout.projectDirectory
    environment 'DOTNET_CLI_TELEMETRY_OPTOUT', '1'
    commandLine dotnetExecutable.get(), 'run', '--project', csharpDirectory.file('Interop.csproj').asFile.absolutePath,
        '-p:RestoreLockedMode=true', '-p:ReferenceRoot=' + referenceRoot.get(), '--', goldenOutput.get().asFile.absolutePath
}
tasks.register('interopTest', Test) {
    group = 'verification'
    dependsOn tasks.named('buildCsharpInterop')
    testClassesDirs = sourceSets.interopTest.output.classesDirs
    classpath = sourceSets.interopTest.runtimeClasspath
    systemProperty 'vimi.concepts.queries.golden', goldenOutput.get().asFile.absolutePath
    inputs.files(fileTree(csharpDirectory) { include '*.cs', '*.csproj', 'packages.lock.json' })
    inputs.file(goldenOutput)
    shouldRunAfter tasks.named('test')
}
