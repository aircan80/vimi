// Phase 0 real-data World measurement (docs/world-measurement-baseline.md). Opt-in, never part
// of check: runs only on a measurement copy of the library (-PdataDirectory=<copy> with a
// MEASUREMENT_COPY marker; it refuses the app's own library), opens it without background work
// and a build already prepared there, never a preparation job; starts the GPU helper and a
// JavaFX toolkit, and ends within ten minutes. -Pprobe.mode=creatures counts creature and humanoid
// NPC outcomes per scenario through the production bridge, without a helper (#553); it uses the
// copy's loaded community keys and may add decoded images or previews to the copy's generated
// store, so a second run starts warm; -Pprobe.mode=displays counts creature display Stand pose
// and geoset outcomes over the whole build, one display per model until -Pprobe.limit or the
// deadline (#377, #455), with the same keys and store use; -Pprobe.mode=refusals
// counts terrain texture refusals over whole maps; -Pprobe.mode=water counts water outcomes over
// every -Pprobe.stride-th tile (#171); -Pprobe.mode=prep times tile prep alone (#422);
// -Pprobe.mode=collision counts the collision bytes of every obj0 placement around each scenario;
// -Pprobe.mode=walk walks a body over each scenario's real 3x3 terrain in eight headings and
// reports where it ended, slides and falls.
// -Pvimi.world.viewDistance=far streams the 5x5 neighbourhood instead of the 3x3 (#173).
tasks.register('worldMeasurementProbe', JavaExec) {
    group = 'verification'
    description = 'Measures the real World pipeline on the local build; see docs/world-measurement-baseline.md.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vimi.gui.WorldMeasurementProbe'
    // The probe's deadline (at most 400 s) plus every close timeout (125 s) stays inside this.
    timeout = java.time.Duration.ofMinutes(10)
    def out = layout.buildDirectory.dir('world-measurement').get().asFile
    doFirst { out.mkdirs() }
    jvmArgs "-Xlog:gc*:file=${new File(out, 'gc.log').absolutePath}:uptime,level,tags"
    systemProperty 'vimi.world.stageTimings', 'true'
    systemProperty 'vimi.world.stageTimings.file', new File(out, 'helper-timings.txt').absolutePath
    systemProperty 'probe.out', out.absolutePath
    // The helper's private packet directories go under the probe's own build folder.
    def temporary = new File(out, 'tmp')
    doFirst { temporary.deleteDir(); temporary.mkdirs() }
    systemProperty 'java.io.tmpdir', temporary.absolutePath
    systemProperty 'probe.gcLog', new File(out, 'gc.log').absolutePath
    ['probe.mode', 'probe.build', 'probe.scenarios', 'probe.maps', 'probe.fillSeconds',
     'probe.rotateSeconds', 'probe.flySeconds', 'probe.settleSeconds', 'probe.mapSeconds',
     'probe.deadlineSeconds', 'probe.size', 'probe.passes', 'probe.objects', 'probe.interiors', 'probe.root',
     'vimi.world.objectTextures', 'vimi.world.creatures', 'vimi.world.viewDistance',
     'vimi.gpu.backend', 'probe.stride', 'probe.limit', 'vimi.world.creatureAnimation', 'probe.stillSeconds', 'probe.camera', 'probe.idleEverywhere'].each { name ->
        def value = providers.gradleProperty(name)
        if (value.isPresent()) systemProperty name, value.get()
    }
}

