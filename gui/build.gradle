plugins {
    id 'application'
}

group = 'com.vibeminer'
version = '0.1.0-SNAPSHOT'
repositories {
    def sdkRepository = providers.gradleProperty('javafxSdkRepository').orNull
    if (sdkRepository) {
        exclusiveContent {
            forRepository {
                ivy {
                    name = 'verifiedJavafxSdk'
                    url = uri(sdkRepository)
                    patternLayout { artifact '[artifact]-[revision]-[classifier].[ext]' }
                    metadataSources { artifact() }
                }
            }
            filter { includeGroup 'org.openjfx' }
        }
    }
    mavenCentral()
}
// SDK adapter JARs contain Java classes; their verified native libraries are separate.
def javafxNativeLibrary = providers.gradleProperty('javafxNativeLibrary').orNull
if (javafxNativeLibrary) {
    tasks.withType(JavaExec).configureEach {
        systemProperty 'java.library.path', javafxNativeLibrary
    }
}
dependencyLocking { lockAllConfigurations() }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

def platform = System.getProperty('os.name').toLowerCase().contains('mac') ? 'mac' :
        (System.getProperty('os.name').toLowerCase().contains('win') ? 'win' : 'linux')
def arch = System.getProperty('os.arch')
def classifier = platform + (arch in ['aarch64', 'arm64'] ? '-aarch64' : '')

dependencies {
    implementation project(':network-activity')
    implementation project(':builds')
    implementation project(':questie')
    implementation project(':eg-link')
    implementation project(':polestar')
    implementation project(':accounting')
    implementation project(':formats-tables')
    implementation project(':concepts-items')
    implementation project(':concepts-creatures')
    implementation project(':concepts-npcs')
    implementation project(':concepts-quests')
    implementation project(':concepts-talents')
    implementation project(':concepts-races')
    implementation project(':concepts-mounts')
    implementation project(':concepts-models')
    implementation project(':concepts-professions')
    implementation project(':rendering-models')
    implementation project(':rendering-bgfx')
    implementation project(':rendering-world')
    implementation project(':concepts-world')
    implementation project(':concepts-dungeons')
    implementation project(':concepts-locations')
    implementation project(':concepts-comparison')
    implementation project(':concepts-effects')
    testImplementation testFixtures(project(':builds'))
    testImplementation testFixtures(project(':polestar'))
    testImplementation testFixtures(project(':files'))
    testImplementation testFixtures(project(':formats-tables'))
    testImplementation testFixtures(project(':concepts-world'))
    testImplementation testFixtures(project(':generated-store'))
    ['base', 'graphics', 'controls'].each {
        implementation "org.openjfx:javafx-${it}:25.0.1:${classifier}"
    }
}

application {
    mainClass = 'com.vimi.gui.Launcher'
    applicationName = 'vimi-gui-prototype'
    // Shared with the packaged app (scripts/release/package_app.py); see the file's comments.
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED'] +
            providers.fileContents(layout.projectDirectory.file('jvm-options.txt')).asText.get()
                    .readLines()*.replaceFirst(/(^|\s)#.*$/, '')*.trim().findAll { it }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.register('prototypeTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vimi.gui.PrototypeTest'
}
check.dependsOn prototypeTest

// Tests use the explicit dependency-free JavaExec harness above, not JUnit discovery.
tasks.named('test') {
    enabled = false
}

// Native calls belong to backend adapters; the design preview performs no native I/O.
tasks.withType(JavaExec).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // JavaFX extracts its natives into ~/.openjfx/cache by default. Parallel test JVMs racing on
    // that shared folder delete and rewrite DLLs another JVM is checking or loading.
    systemProperty 'javafx.cachedir',
            layout.buildDirectory.dir("tmp/${name}/javafx-cache").get().asFile.absolutePath
    // Keep the JVM crash log if a native fault ends the process, so CI can retain it.
    def crashLog = layout.buildDirectory.file("reports/jvm-crash/${name}-hs_err_pid%p.log")
    jvmArgs "-XX:ErrorFile=${crashLog.get().asFile.absolutePath}"
    def crashDirectory = crashLog.get().asFile.parentFile
    // The JVM does not create the ErrorFile directory; without it hs_err falls back to the cwd.
    doFirst { crashDirectory.mkdirs() }
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
    }
    def dataDirectory = providers.gradleProperty('dataDirectory')
    if (dataDirectory.isPresent()) {
        systemProperty 'vimi.dataDirectory', dataDirectory.get()
    }
    // Diagnostic renderer override for the inline GPU World: default, vulkan, metal or d3d11.
    def gpuBackend = providers.gradleProperty('gpuBackend')
    if (gpuBackend.isPresent()) {
        systemProperty 'vimi.gpu.backend', gpuBackend.get()
    }
}
