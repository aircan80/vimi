buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

plugins {
    id 'java-library'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.vibeminer'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

dependencies {
    api project(':object-access')
    api project(':formats-tables')
    api project(':formats-assets')
    implementation project(':questie')
    implementation project(':polestar')
    implementation project(':eg-link')
    implementation 'com.fasterxml.jackson.core:jackson-core:2.20.1'
    testImplementation testFixtures(project(':formats-tables'))
    testImplementation testFixtures(project(':files'))
    testImplementation testFixtures(project(':generated-store'))
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// Fast unit and in-memory contract tests are the normal development command.
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    maxParallelForks = 1
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
        inputs.file(sqliteLibrary).withPropertyName('sqliteLibrary')
    }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }

}

spotless {
    java {
        target 'src/**/*.java'
        forbidWildcardImports()
        googleJavaFormat('1.30.0').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}
