buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.vibeminer'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

sourceSets {
    interopTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    interopTestImplementation.extendsFrom testImplementation
    interopTestRuntimeOnly.extendsFrom testRuntimeOnly
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    testFixturesApi platform('org.junit:junit-bom:5.13.4')
    testFixturesApi 'org.junit.jupiter:junit-jupiter-api'
    testFixturesImplementation testFixtures(project(':generated-store'))
    api project(':files')
    api project(':generated-store')
    implementation 'com.fasterxml.jackson.core:jackson-core:2.20.1'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation testFixtures(project(':generated-store'))
    testImplementation testFixtures(project(':files'))
    testImplementation testFixtures(project(':object-access'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    integrationTestImplementation testFixtures(project(':formats-tables'))
    integrationTestImplementation testFixtures(project(':files'))
    integrationTestImplementation testFixtures(project(':builds'))
    integrationTestImplementation testFixtures(project(':object-access'))
    integrationTestImplementation testFixtures(project(':network-clients'))
    interopTestImplementation testFixtures(project(':formats-tables'))
}

// Fast unit and in-memory contract tests are the normal development command.
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    maxParallelForks = 1
    def sqliteLibrary = providers.gradleProperty('sqliteLibrary')
    if (sqliteLibrary.isPresent()) {
        systemProperty 'vibeminer.sqlite.library', sqliteLibrary.get()
        inputs.file(sqliteLibrary).withPropertyName('sqliteLibrary')
    }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }

}

tasks.register('integrationTest', Test) {
    description = 'Runs catalog persistence and history projection contracts.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
}

// CI's check includes Java integration tests. Interop is explicitly requested separately.
tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

spotless {
    java {
        target 'src/**/*.java'
        forbidWildcardImports()
        googleJavaFormat('1.30.0').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}



// Opt-in exchange with the unchanged pinned C# formats and generated-store implementations.
def repoRoot = rootProject.layout.projectDirectory
def referenceRoot = providers.gradleProperty('referenceRoot').orElse(repoRoot.file('../vibeminer').asFile.absolutePath)
def dotnetExecutable = providers.gradleProperty('dotnet').orElse(repoRoot.file('../vibeminer/.local/toolchains/dotnet/dotnet').asFile.absolutePath)
def csharpDirectory = layout.projectDirectory.dir('src/interopTest/csharp')
tasks.register('buildCsharpInterop', Exec) {
    workingDir repoRoot
    environment 'DOTNET_CLI_HOME', repoRoot.dir('.local/dotnet').asFile.absolutePath
    environment 'DOTNET_CLI_TELEMETRY_OPTOUT', '1'
    commandLine dotnetExecutable.get(), 'build', csharpDirectory.file('Interop.csproj').asFile.absolutePath,
        '-p:RestoreLockedMode=true', '-p:NuGetAudit=false', '-p:ReferenceRoot=' + referenceRoot.get(), '--nologo'
}
tasks.register('interopTest', Test) {
    group = 'verification'
    description = 'Exchanges generated table caches and portable row/identity bytes with pinned C#.'
    dependsOn tasks.named('buildCsharpInterop')
    testClassesDirs = sourceSets.interopTest.output.classesDirs
    classpath = sourceSets.interopTest.runtimeClasspath
    systemProperty 'vimi.dotnet', dotnetExecutable.get()
    systemProperty 'vimi.tables.harness', csharpDirectory.file('bin/Debug/net10.0/VibeMiner.Formats.Tests.dll').asFile.absolutePath
    inputs.files(fileTree(csharpDirectory) { include '*.cs', '*.csproj', 'packages.lock.json' })
    inputs.file(referenceRoot.map { new File(it, 'src/backend/VibeMiner.Formats/bin/Release/net10.0/VibeMiner.Formats.dll') })
    inputs.files(fileTree(csharpDirectory.dir('bin/Debug/net10.0')))
    shouldRunAfter tasks.named('integrationTest')
}
